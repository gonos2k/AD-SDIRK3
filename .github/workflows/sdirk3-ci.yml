name: SDIRK3 CI

# Research CI: short numerical/state/adjoint regressions on every PR.
# Long inverse experiments remain explicit workflow_dispatch diagnostics.
# Packaging, installation and deployment checks are outside this lane.

on:
  pull_request:
    branches: [main, ad-main]
  push:
    branches: [main, ad-main]
  merge_group:
  workflow_dispatch:
    inputs:
      fine_accuracy_diagnostic:
        description: 'Fixed returned-state time or gradient diagnostic only'
        required: false
        type: boolean
        default: false
      fine_accuracy_schedule:
        description: 'Explicit fixed-state diagnostic; observations remain 150/300s'
        type: choice
        options: [h2.5, h1.25, carry-h.625, carry-h.3125, h5-component-fd, h5-split-vjp, small-step-inverse, memory-smoke]
        default: h2.5

permissions:
  contents: read

env:
  # Multi-version Python CI is deferred; automatic runs use only this baseline.
  PYTHON_VERSION: '3.12'

concurrency:
  group: sdirk3-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: fast-contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.fine_accuracy_diagnostic != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: changed research Python syntax
        run: |
          python3 -m py_compile tools/test_fine_wave_inverse.py \
            tools/probe_small_step_inverse.py tools/probe_fine_split_pullbacks.py \
            tools/probe_fine_returned_accuracy.py tools/probe_fine_gradient_components.py \
            tools/probe_retained_memory_smoke.py
      - name: CPU setup shell syntax
        run: bash -n .github/ci/setup_torch_env.sh
      - name: actionlint (pinned binary, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSL -o /tmp/actionlint.tar.gz "$url"
          echo "$sha  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          /tmp/actionlint -version
          /tmp/actionlint


  core-linux:
    name: core-linux
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.fine_accuracy_diagnostic != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UCX_TLS: shm,tcp,self
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/ci/requirements-core.txt
      - name: pinned CPU torch and fingerprint
        run: bash .github/ci/setup_torch_env.sh
      - name: native build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache mpich libmpich-dev
      - name: restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ccache
          key: ${{ runner.os }}-sdirk3-research-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sdirk3-research-
            ${{ runner.os }}-sdirk3-
            ${{ runner.os }}-fine-accuracy-
      - name: configure the real core once
        run: |
          cmake -S external/libtorch_wrf/sdirk3 -B build/sdirk3-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$TORCH_CMAKE_PREFIX" \
            -DWRF_SDIRK3_ABI_STRICT=AUTO -DWRF_SDIRK3_TORCH_ABI="$TORCH_ABI" \
            -DSDIRK3_QUIET_TESTS=ON -DUSE_FAST_POW_0875=OFF
      - name: build only affected numerical and adjoint targets
        run: |
          cmake --build build/sdirk3-core --parallel 2 --target \
            test_probe_noninterference test_fixed_trajectory_derivative \
            test_fixed_trajectory_lifecycle test_fp64_handoff_probe \
            test_full_tile_step test_native_wave_refinement
      - name: selected short numerical regressions
        run: |
          tests=(Diagnostic_Observer_Noninterference_Contract Fixed_Trajectory_Derivative Fixed_Trajectory_Lifecycle FP64_State_Handoff_Contract Full_Tile_Step_Adjoint)
          regex="^($(IFS='|'; echo "${tests[*]}"))$"
          ctest --test-dir build/sdirk3-core --show-only=json-v1 -R "$regex" > build/sdirk3-core/selected-tests.json
          python3 -c 'import json,sys; names=[t["name"] for t in json.load(open(sys.argv[1]))["tests"]]; assert sorted(names)==sorted(sys.argv[2:]), names' \
            build/sdirk3-core/selected-tests.json "${tests[@]}"
          ctest --test-dir build/sdirk3-core -R "$regex" --parallel 2 --output-on-failure --no-tests=error
      - name: same-executable short block replay
        run: |
          mkdir -p build/sdirk3-core/replay-smoke
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          fixture=Path('tools/fixtures/pr282-exact-returned-state.zip')
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()=='e170be5d1e2b0d87efcdc9ebe0f4dd1d381aceb9e0777dcd074e0dcfe1329d8c'
          with zipfile.ZipFile(fixture) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              for name in ('initial_state.txt','observations.txt'):
                  blob=z.read(name)
                  assert hashlib.sha256(blob).hexdigest()==manifest['files'][name]['sha256']
                  (Path('build/sdirk3-core/replay-smoke')/name).write_bytes(blob)
          PY
          build/sdirk3-core/test_native_wave_refinement 16 12 8 \
            build/sdirk3-core/replay-smoke/result.csv --physical-wave-inverse \
            build/sdirk3-core/replay-smoke/initial_state.txt \
            build/sdirk3-core/replay-smoke/observations.txt 16 0.3125 \
            --newton-tol 1e-14 --krylov-tol 1e-12 --replay-smoke
      - name: inverse metadata consumer regression
        run: |
          python3 -B tools/test_fine_wave_inverse.py --check-metadata \
            build/sdirk3-core/replay-smoke/result.csv \
            --newton-tol 1e-14 --krylov-tol 1e-12
      - name: preserve research test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-core-diagnostics
          if-no-files-found: ignore
          path: |
            build/sdirk3-core/Testing/Temporary/
            build/sdirk3-core/selected-tests.json
            build/sdirk3-core/replay-smoke/
            build/sdirk3-core/CMakeCache.txt
      - name: compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats

  fine-accuracy-diagnostic:
    name: DIAGNOSTIC ONLY - fixed fine returned-state accuracy
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fine_accuracy_diagnostic == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.fine_accuracy_schedule == 'small-step-inverse' && 120 || 35 }}
    env:
      UCX_TLS: shm,tcp,self
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/ci/requirements-core.txt
      - name: pinned CPU torch and fingerprint
        run: bash .github/ci/setup_torch_env.sh
      - name: native build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache mpich libmpich-dev
      - name: memory diagnostic tool
        if: ${{ inputs.fine_accuracy_schedule == 'memory-smoke' }}
        run: sudo apt-get install -y -q valgrind
      - name: restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-fine-accuracy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sdirk3-
            ${{ runner.os }}-fine-accuracy-
      - name: configure and build only the native probe
        run: |
          set -euo pipefail
          cmake -S external/libtorch_wrf/sdirk3 -B build/fine-accuracy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$TORCH_CMAKE_PREFIX" -DWRF_SDIRK3_ABI_STRICT=AUTO \
            -DWRF_SDIRK3_TORCH_ABI="$TORCH_ABI" -DSDIRK3_QUIET_TESTS=ON -DUSE_FAST_POW_0875=OFF
          cmake --build build/fine-accuracy --target test_native_wave_refinement --parallel 2
      - name: download pinned four-coordinate diagnostic for split VJP
        if: ${{ inputs.fine_accuracy_schedule == 'h5-split-vjp' || inputs.fine_accuracy_schedule == 'small-step-inverse' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/gonos2k/AD-SDIRK3/actions/artifacts/11609905043/zip > build/fine-accuracy/fd-reference.zip
      - name: selected fixed-state time or component-gradient diagnostic
        run: |
          if [[ '${{ inputs.fine_accuracy_schedule }}' == 'small-step-inverse' ]]; then
            python3 -B tools/probe_small_step_inverse.py \
              --preflight-only --exe "$PWD/build/fine-accuracy/test_native_wave_refinement" \
              --fixture tools/fixtures/pr282-exact-returned-state.zip \
              --fd-zip build/fine-accuracy/fd-reference.zip \
              --outdir build/fine-accuracy/measurement
            build/fine-accuracy/test_native_wave_refinement 16 12 8 \
              build/fine-accuracy/measurement/replay_gate.csv --physical-wave-inverse \
              build/fine-accuracy/measurement/inputs/initial_state.txt \
              build/fine-accuracy/measurement/inputs/observations.txt 16 0.3125 \
              --newton-tol 1e-14 --krylov-tol 1e-12 --replay-smoke
            GATE_EXE_SHA=$(sha256sum build/fine-accuracy/test_native_wave_refinement | cut -d ' ' -f 1)
            python3 -B tools/probe_small_step_inverse.py \
              --exe "$PWD/build/fine-accuracy/test_native_wave_refinement" \
              --fixture tools/fixtures/pr282-exact-returned-state.zip \
              --fd-zip build/fine-accuracy/fd-reference.zip \
              --gate-csv build/fine-accuracy/measurement/replay_gate.csv \
              --gate-exe-sha "$GATE_EXE_SHA" \
              --outdir build/fine-accuracy/measurement
          elif [[ '${{ inputs.fine_accuracy_schedule }}' == 'h5-split-vjp' ]]; then
            python3 -B tools/probe_fine_split_pullbacks.py \
              --exe build/fine-accuracy/test_native_wave_refinement \
              --fixture tools/fixtures/pr282-exact-returned-state.zip \
              --fd-zip build/fine-accuracy/fd-reference.zip \
              --out build/fine-accuracy/measurement
          elif [[ '${{ inputs.fine_accuracy_schedule }}' == 'memory-smoke' ]]; then
            python3 -B tools/probe_retained_memory_smoke.py \
              --build-dir build/fine-accuracy \
              --fixture tools/fixtures/pr282-exact-returned-state.zip \
              --out build/fine-accuracy/measurement
          elif [[ '${{ inputs.fine_accuracy_schedule }}' == 'h5-component-fd' ]]; then
            python3 -B tools/probe_fine_gradient_components.py \
              --exe build/fine-accuracy/test_native_wave_refinement \
              --fixture tools/fixtures/pr282-exact-returned-state.zip \
              --out build/fine-accuracy/measurement
          else
            python3 -B tools/probe_fine_returned_accuracy.py \
              --exe build/fine-accuracy/test_native_wave_refinement \
              --fixture tools/fixtures/pr282-exact-returned-state.zip \
              --out build/fine-accuracy/measurement \
              --schedule '${{ inputs.fine_accuracy_schedule }}'
          fi
      - name: preserve measurement even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixed-fine-accuracy-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/fine-accuracy/measurement/
            build/fine-accuracy/CMakeCache.txt
      - name: compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats

  required:
    name: required
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.fine_accuracy_diagnostic == true) }}
    needs: [fast-contracts, core-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: verify minimum research jobs
        env:
          FAST: ${{ needs.fast-contracts.result }}
          CORE: ${{ needs.core-linux.result }}
        run: |
          test "$FAST" = success
          test "$CORE" = success
